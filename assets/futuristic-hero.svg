<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Sumit Yadav futuristic animated developer hero</title>
  <desc id="desc">Animated cyberpunk space scene with a glowing digital globe, orbit rings, technology labels, laptop, mountains and developer branding.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010713"/>
      <stop offset="0.48" stop-color="#03132d"/>
      <stop offset="1" stop-color="#020818"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#18bfff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#1677ff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="42%" cy="35%" r="68%">
      <stop offset="0" stop-color="#0b6bca" stop-opacity=".55"/>
      <stop offset=".48" stop-color="#06356f" stop-opacity=".34"/>
      <stop offset="1" stop-color="#010713" stop-opacity=".95"/>
    </radialGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset=".5" stop-color="#6b7cff"/>
      <stop offset="1" stop-color="#21e6ff"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#19d8ff"/>
    </linearGradient>
    <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#008cff" flood-opacity=".55"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#58bfff" opacity=".12"/>
    </pattern>
    <clipPath id="earthClip"><circle cx="690" cy="300" r="205"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <ellipse cx="780" cy="300" rx="560" ry="330" fill="url(#glow)" filter="url(#blur20)"/>

  <!-- Stars -->
  <g fill="#6ddcff">
    <circle cx="60" cy="52" r="1.7"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="124" r="1.3"><animate attributeName="opacity" values=".9;.15;.9" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="56" r="1.6"><animate attributeName="opacity" values=".25;1;.25" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="92" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="36" r="1.4"><animate attributeName="opacity" values=".8;.1;.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="42" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="88" r="1.4"><animate attributeName="opacity" values=".8;.2;.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="50" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1490" cy="130" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1540" cy="390" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Tiny wireframe diamonds -->
  <g fill="none" stroke="#149dff" stroke-width="1.2" opacity=".75">
    <g transform="translate(405 82)">
      <path d="M0 0 52 12 73 57 25 82 -10 46Z"/>
      <path d="M0 0 25 82M52 12 25 82M-10 46 52 12M-10 46 73 57M25 82 73 57"/>
    </g>
    <g transform="translate(1340 205) scale(.72)">
      <path d="M0 0 52 12 73 57 25 82 -10 46Z"/>
      <path d="M0 0 25 82M52 12 25 82M-10 46 52 12M-10 46 73 57M25 82 73 57"/>
    </g>
  </g>

  <!-- Left code telemetry -->
  <g font-family="monospace" font-size="14">
    <text x="28" y="42" fill="#21d8ff">&gt; turning_ideas_into_impact()</text>
    <text x="28" y="68" fill="#4c6c98">&gt; code</text>
    <text x="28" y="92" fill="#4c6c98">&gt; learn</text>
    <text x="28" y="116" fill="#4c6c98">&gt; build</text>
    <text x="28" y="140" fill="#4c6c98">&gt; improve</text>
    <text x="28" y="164" fill="#4c6c98">&gt; repeat</text>
  </g>

  <!-- Right telemetry -->
  <g font-family="monospace" font-size="14" fill="#38a8ff">
    <text x="1450" y="45" letter-spacing="3">DISCIPLINE</text>
    <text x="1450" y="72" letter-spacing="3">CREATES</text>
    <text x="1450" y="99" letter-spacing="3">FREEDOM</text>
    <path d="M1450 122h58" stroke="#00dfff" stroke-width="2"/>
    <text x="1400" y="470" fill="#2875b8">{</text>
    <text x="1420" y="494">ideas: <tspan fill="#19d8ff">true</tspan>,</text>
    <text x="1420" y="518">consistency: <tspan fill="#19d8ff">true</tspan>,</text>
    <text x="1420" y="542">success: <tspan fill="#ff9f43">loading...</tspan></text>
    <text x="1400" y="566" fill="#2875b8">}</text>
  </g>

  <!-- Globe glow -->
  <circle cx="690" cy="300" r="245" fill="none" stroke="#168cff" stroke-opacity=".18" stroke-width="28" filter="url(#blur20)"/>
  <circle cx="690" cy="300" r="205" fill="url(#earth)" stroke="#1e9eff" stroke-width="1.4" opacity=".96"/>

  <!-- Rotating globe grid -->
  <g clip-path="url(#earthClip)" fill="none" stroke="#159fff" stroke-width="1" opacity=".55">
    <g>
      <ellipse cx="690" cy="300" rx="205" ry="74"/>
      <ellipse cx="690" cy="300" rx="205" ry="132"/>
      <ellipse cx="690" cy="300" rx="205" ry="182"/>
      <ellipse cx="690" cy="300" rx="76" ry="205"/>
      <ellipse cx="690" cy="300" rx="145" ry="205"/>
      <ellipse cx="690" cy="300" rx="200" ry="205"/>
      <path d="M485 300h410M510 225h360M510 375h360"/>
      <animateTransform attributeName="transform" type="rotate" from="0 690 300" to="360 690 300" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Globe particles -->
  <g clip-path="url(#earthClip)" fill="#26baff">
    <circle cx="580" cy="205" r="2"/><circle cx="615" cy="178" r="1.6"/><circle cx="640" cy="240" r="2"/>
    <circle cx="715" cy="160" r="1.5"/><circle cx="760" cy="215" r="1.8"/><circle cx="800" cy="275" r="1.4"/>
    <circle cx="625" cy="335" r="1.5"/><circle cx="700" cy="395" r="1.7"/><circle cx="770" cy="350" r="2"/>
    <circle cx="545" cy="295" r="1.4"/>
  </g>

  <!-- Orbit rings -->
  <g fill="none" stroke="url(#cyanBlue)" stroke-width="3" stroke-linecap="round">
    <ellipse cx="690" cy="300" rx="350" ry="118" transform="rotate(-12 690 300)" stroke-dasharray="900 1100">
      <animateTransform attributeName="transform" type="rotate" from="-12 690 300" to="348 690 300" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="690" cy="300" rx="360" ry="150" transform="rotate(16 690 300)" opacity=".65" stroke-dasharray="700 1400">
      <animateTransform attributeName="transform" type="rotate" from="16 690 300" to="-344 690 300" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Orbiting nodes -->
  <g>
    <circle cx="1028" cy="210" r="12" fill="#22dfff" filter="url(#shadow)">
      <animate attributeName="r" values="9;15;9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="365" r="11" fill="#6574ff">
      <animate attributeName="r" values="8;14;8" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="430" r="12" fill="#16d8cf">
      <animate attributeName="r" values="9;15;9" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main title -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="920" y="205" fill="#9bb8df" font-family="monospace" font-size="16" letter-spacing="7">&lt; BUILDING A BETTER TOMORROW /&gt;</text>
    <text x="920" y="320" fill="url(#nameGrad)" font-size="78" font-weight="900" letter-spacing="2" filter="url(#shadow)">SUMIT YADAV</text>
    <path d="M590 350h120M1130 350h120" stroke="#00dfff" stroke-width="2"/>
    <text x="920" y="357" fill="#dcecff" font-size="18" letter-spacing="7">COMPUTER SCIENCE ENGINEER</text>
  </g>

  <!-- Code / Learn / Build / Grow -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#1dd7ff" font-size="30">
      <text x="700" y="410">&lt;/&gt;</text>
      <text x="805" y="410">♧</text>
      <text x="920" y="410">⚙</text>
      <text x="1035" y="410">▮▮▮</text>
    </g>
    <g fill="#dcecff" font-size="14">
      <text x="700" y="438">Code</text><text x="805" y="438">Learn</text>
      <text x="920" y="438">Build</text><text x="1035" y="438">Grow</text>
    </g>
    <g stroke="#376a9f" stroke-width="1">
      <path d="M755 386v66M865 386v66M980 386v66"/>
    </g>
  </g>

  <!-- Tech cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(180 138)">
      <rect width="175" height="54" rx="12" fill="#03152b" stroke="#15518c"/>
      <text x="20" y="34" font-size="28" fill="#22dfff">⚛</text>
      <text x="62" y="34" font-size="17" fill="#28baff">React.js</text>
      <animateTransform attributeName="transform" type="translate" values="180 138;180 132;180 138" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1210 90)">
      <rect width="180" height="54" rx="12" fill="#03152b" stroke="#1b765d"/>
      <text x="20" y="35" font-size="27" fill="#5af0b0">JS</text>
      <text x="72" y="34" font-size="17" fill="#55e6ae">Node.js</text>
      <animateTransform attributeName="transform" type="translate" values="1210 90;1210 84;1210 90" dur="4.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(105 350)">
      <rect width="180" height="54" rx="12" fill="#03152b" stroke="#12695b"/>
      <text x="20" y="35" font-size="28" fill="#51e0a2">◆</text>
      <text x="62" y="34" font-size="17" fill="#40e5ad">MongoDB</text>
      <animateTransform attributeName="transform" type="translate" values="105 350;105 344;105 350" dur="5.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1375 335)">
      <rect width="150" height="54" rx="12" fill="#03152b" stroke="#3e2b8a"/>
      <text x="20" y="35" font-size="25" fill="#a68cff">▲</text>
      <text x="55" y="34" font-size="17" fill="#a68cff">Next.js</text>
      <animateTransform attributeName="transform" type="translate" values="1375 335;1375 329;1375 335" dur="4.3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Mountains -->
  <path d="M0 565 L95 470 160 535 250 445 330 540 430 475 520 565 Z" fill="#020817" stroke="#0c3b72" stroke-width="2"/>
  <path d="M1000 565 L1085 500 1140 535 1240 450 1320 525 1400 470 1510 545 1600 480 1600 640 1000 640Z" fill="#020817" stroke="#0c3b72" stroke-width="2"/>
  <path d="M0 600 Q800 510 1600 600 L1600 640 0 640Z" fill="#01050e"/>

  <!-- Laptop -->
  <g transform="translate(55 425)">
    <polygon points="0,20 215,0 245,150 28,170" fill="#03101f" stroke="#157bcb" stroke-width="2"/>
    <polygon points="17,31 205,14 226,132 38,148" fill="#01060d" stroke="#0d3e70"/>
    <text x="35" y="70" fill="#2ad8ff" font-family="monospace" font-size="13">$ git commit -m</text>
    <text x="35" y="94" fill="#1e9fff" font-family="monospace" font-size="13">"A better me"</text>
    <text x="35" y="124" fill="#4fffb1" font-family="monospace" font-size="13">✓ committed!</text>
    <polygon points="28,170 245,150 290,170 60,190" fill="#06182b" stroke="#1267a6"/>
  </g>

  <!-- Bottom horizon -->
  <ellipse cx="800" cy="610" rx="520" ry="70" fill="none" stroke="#247cff" stroke-width="2" filter="url(#shadow)"/>
  <g text-anchor="middle" font-family="monospace">
    <text x="800" y="595" fill="#31bfff" font-size="13" letter-spacing="5">BUILD • LEARN • IMPROVE • REPEAT</text>
    <path d="M775 618h50" stroke="#1d8fff" stroke-width="2"/>
  </g>

  <!-- Signature -->
  <g transform="translate(1320 565) rotate(-10)" font-family="cursive" font-style="italic">
    <text x="0" y="0" fill="#21d8ff" font-size="25">Same</text>
    <text x="0" y="27" fill="#5d8dff" font-size="25">Student</text>
    <text x="0" y="54" fill="#9b7cff" font-size="25">Bigger Dreams</text>
    <path d="M5 65 Q75 78 155 45" fill="none" stroke="#1bdfff" stroke-width="2"/>
  </g>
</svg>
